                      </div>

                      <div className="p-3 bg-rose-50/50 rounded-xl border border-rose-100 text-center">
                        <span className="text-[10px] font-bold text-rose-700 block uppercase">Архив</span>
                        <span className="text-xl font-bold text-slate-800 block mt-2">{stats.lost}</span>
                      </div>
                    </div>

                    <div className="mt-4 p-4 bg-slate-50 rounded-xl border border-slate-100 flex items-center gap-3">
                      <i className="fa-solid fa-circle-info text-indigo-500 text-lg shrink-0"></i>
                      <p className="text-xs text-slate-600 leading-relaxed">
                        <strong>Рекомендация:</strong> Держите на особом контроле пациентов в статусе <strong>«Реабилитация / Ожидание»</strong>. Своевременно отправляйте памятки ухода для обеспечения премиального клиентского опыта.
                      </p>
                    </div>
                  </div>

                </div>
              </div>
            )}
          </main>

          { }
          {/* МОДАЛЬНОЕ ОКНО: ДОБАВЛЕНИЕ КЛИЕНТА */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
                
                <div className="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-sparkles text-indigo-600 text-lg"></i>
                    <h3 className="text-lg font-bold text-slate-900">Создание медицинской карты</h3>
                  </div>
                  <button 
                    onClick={() => setIsAddModalOpen(false)}
                    className="text-slate-400 hover:text-slate-600 p-1.5 hover:bg-slate-100 rounded-lg transition-all"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  const data = Object.fromEntries(formData.entries());
                  handleAddClient(data);
                }} className="p-6 overflow-y-auto space-y-4 flex-1">
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">ФИО пациента *</label>
                      <input 
                        required 
                        type="text" 
                        name="fullName"
                        placeholder="Иванова Анна Ивановна"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Процедура *</label>
                      <select 
                        required
                        name="procedure"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        {PROCEDURE_OPTIONS.map(opt => (
                          <option key={opt} value={opt}>{opt}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Номер телефона *</label>
                      <input 
                        required 
                        type="tel" 
                        name="phone"
                        placeholder="+7 (999) 000-00-00"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Электронная почта</label>
                      <input 
                        type="email" 
                        name="email"
                        placeholder="example@mail.ru"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Статус сопровождения</label>
                      <select 
                        name="status"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="new">🆕 Новый пациент</option>
                        <option value="active">🟢 Активный курс</option>
                        <option value="waiting">🕒 Реабилитационный период</option>
                        <option value="completed">✅ Курс завершен</option>
                        <option value="lost">❌ Архив / Потерян</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Источник привлечения</label>
                      <select 
                        name="source"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="instagram">Профиль Instagram</option>
                        <option value="referral">Рекомендация</option>
                        <option value="ads">Реклама</option>
                        <option value="walkin">Без записи</option>
                        <option value="other">Другое</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Сумма оплат (₽)</label>
                      <input 
                        type="number" 
                        name="totalSpent"
                        placeholder="0"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Количество визитов</label>
                      <input 
                        type="number" 
                        name="visitsCount"
                        placeholder="0"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                  </div>

                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Пожелания пациента и эстетические цели</label>
                      <textarea 
                        name="notes"
                        placeholder="Например: желает естественные губы, боится отечности..."
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 h-20 resize-none"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-rose-600 uppercase tracking-wider mb-1.5">Противопоказания и аллергический статус</label>
                      <textarea 
                        name="contraindications"
                        placeholder="Аллергия на лидокаин, повышенная склонность к гематомам..."
                        className="w-full bg-slate-50 border border-rose-100 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-rose-500 h-16 resize-none"
                      ></textarea>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-100 flex items-center justify-end space-x-2">
                    <button 
                      type="button"
                      onClick={() => setIsAddModalOpen(false)}
                      className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium transition-all"
                    >
                      Отмена
                    </button>
                    <button 
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-md transition-all"
                    >
                      Создать карту
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

          { }
          {/* МОДАЛЬНОЕ ОКНО: РЕДАКТИРОВАНИЕ КЛИЕНТА */}
          {isEditModalOpen && editingClient && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
                
                <div className="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-pen-to-square text-indigo-600 text-lg"></i>
                    <h3 className="text-lg font-bold text-slate-900">Изменение карты: {editingClient.fullName}</h3>
                  </div>
                  <button 
                    onClick={() => {
                      setIsEditModalOpen(false);
                      setEditingClient(null);
                    }}
                    className="text-slate-400 hover:text-slate-600 p-1.5 hover:bg-slate-100 rounded-lg transition-all"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  const data = Object.fromEntries(formData.entries());
                  handleUpdateClient({
                    ...editingClient,
                    ...data
                  });
                }} className="p-6 overflow-y-auto space-y-4 flex-1">
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">ФИО пациента *</label>
                      <input 
                        required 
                        type="text" 
                        name="fullName"
                        defaultValue={editingClient.fullName}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Процедура *</label>
                      <select 
                        required
                        name="procedure"
                        defaultValue={editingClient.procedure}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        {PROCEDURE_OPTIONS.map(opt => (
                          <option key={opt} value={opt}>{opt}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Номер телефона *</label>
                      <input 
                        required 
                        type="tel" 
                        name="phone"
                        defaultValue={editingClient.phone}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Электронная почта</label>
                      <input 
                        type="email" 
                        name="email"
                        defaultValue={editingClient.email}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Статус сопровождения</label>
                      <select 
                        name="status"
                        defaultValue={editingClient.status}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="new">🆕 Новый пациент</option>
                        <option value="active">🟢 Активный курс</option>
                        <option value="waiting">🕒 Реабилитационный период</option>
                        <option value="completed">✅ Курс завершен</option>
                        <option value="lost">❌ Архив / Потерян</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Источник привлечения</label>
                      <select 
                        name="source"
                        defaultValue={editingClient.source}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="instagram">Профиль Instagram</option>
                        <option value="referral">Рекомендация</option>
                        <option value="ads">Реклама</option>
                        <option value="walkin">Без записи</option>
                        <option value="other">Другое</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Сумма всех оплат (₽)</label>
                      <input 
                        type="number" 
                        name="totalSpent"
                        defaultValue={editingClient.totalSpent}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Количество визитов</label>
                      <input 
                        type="number" 
                        name="visitsCount"
                        defaultValue={editingClient.visitsCount}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                  </div>

                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Пожелания пациента и эстетические цели</label>
                      <textarea 
                        name="notes"
                        defaultValue={editingClient.notes}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 h-20 resize-none"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-rose-600 uppercase tracking-wider mb-1.5">Противопоказания и аллергический статус</label>
                      <textarea 
                        name="contraindications"
                        defaultValue={editingClient.contraindications}
                        className="w-full bg-slate-50 border border-rose-100 rounded-xl px-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-rose-500 h-16 resize-none"
                      ></textarea>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-100 flex items-center justify-end space-x-2">
                    <button 
                      type="button"
                      onClick={() => {
                        setIsEditModalOpen(false);
                        setEditingClient(null);
                      }}
                      className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium transition-all"
                    >
                      Отмена
                    </button>
                    <button 
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-md transition-all"
                    >
                      Сохранить изменения
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

          { }
          {/* КАСТОМНОЕ ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ */}
          {deleteConfirmation.isOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden p-6 space-y-4">
                <div className="flex items-center gap-3 text-rose-600">
                  <i className="fa-solid fa-triangle-exclamation text-2xl animate-pulse"></i>
                  <h3 className="text-lg font-bold">Подтверждение удаления</h3>
                </div>
                
                <p className="text-sm text-slate-600 leading-relaxed">
                  Вы уверены, что хотите полностью стереть медицинскую карту <strong>{deleteConfirmation.clientName}</strong>? Это действие удалит всю историю процедур, карту инъекций и загруженные фотографии без возможности восстановления.
                </p>

                <div className="flex justify-end space-x-2 pt-2">
                  <button
                    onClick={() => setDeleteConfirmation({ isOpen: false, clientId: null, clientName: '' })}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition-all"
                  >
                    Отмена
                  </button>
                  <button
                    onClick={confirmDeleteClient}
                    className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-medium shadow-md shadow-rose-100 transition-all"
                  >
                    Удалить навсегда
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Подвал */}
          <footer className="bg-white border-t border-slate-200 mt-auto py-6">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-400 font-medium">
              <p>© 2026 Lumiere Aesthetic Inc. Все данные надежно шифруются и хранятся локально в сессии вашего браузера.</p>
              <div className="flex gap-4">
                <span className="cursor-pointer hover:text-slate-600">Политика безопасности</span>
                <span>•</span>
                <span className="cursor-pointer hover:text-slate-600 text-indigo-500 font-semibold">Lumiere AI v2.2</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
