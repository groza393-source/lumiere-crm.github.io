</head>
<body class="bg-slate-50 text-slate-900 font-sans flex flex-col antialiased min-h-screen">

    const { useState, useMemo, useEffect, useRef } = React;

    // Начальные демо-данные для демонстрации

        createdAt: "2026-02-12",

        markers: [
          { x: 130, y: 160, type: "laser", label: "Шлифовка щечной зоны CO2" },
          { x: 250, y: 160, type: "laser", label: "Шлифовка щечной зоны CO2" }
        ],
        history: [
          { id: "h-4", date: "2026-02-14", title: "Лазерная шлифовка лица", drug: "CO2 Ланцет", cost: 28000, notes: "Параметры средние. Рекомендован пантенол и SPF 50." }
        ],
        photos: []
      }
    ];

    const PROCEDURE_OPTIONS = [
      "Ботулинотерапия (все лицо)",
      "Контурная пластика губ (Juvederm)",
      "Моделирование скул филлером",
      "Лазерная шлифовка кожи",
      "Химический пилинг",
      "Микроигольчатый РФ-лифтинг с PRP",
      "Безоперационная ринопластика",
      "Пилинг HydraFacial Премиум",
      "Лазерная эпиляция",
      "Консультация специалиста"
    ];

    const STATUS_LABELS = {
      all: "Все статусы",
      new: "🆕 Новые клиенты",
      active: "🟢 Активный курс",
      waiting: "🕒 Реабилитация / Ожидание",
      completed: "✅ Курс завершен",
      lost: "❌ Архив / Потерян"
    };

    const SOURCE_LABELS = {
      all: "Все каналы",
      instagram: "Instagram",
      referral: "Рекомендация",
      ads: "Реклама / Маркетинг",
      walkin: "Без записи",
      other: "Другое"
    };

    const MARKER_TYPES = {
      filler: { color: "#ec4899", label: "Филлер (Гиалуроновая кислота)", border: "border-pink-500" },
      toxin: { color: "#3b82f6", label: "Ботулинотерапия (Токсин)", border: "border-blue-500" },
      meso: { color: "#10b981", label: "Мезотерапия / Биоревитализация", border: "border-emerald-500" },
      laser: { color: "#f97316", label: "Аппаратные методики / Пилинги", border: "border-orange-500" }
    };

    function App() {
      const [clients, setClients] = useState(() => {
        const saved = localStorage.getItem('aesthetic_crm_clients_v3');
        return saved ? JSON.parse(saved) : INITIAL_CLIENTS;
      });

      const [activeTab, setActiveTab] = useState('directory'); 
      const [selectedClientTab, setSelectedClientTab] = useState('medcard'); 
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [sourceFilter, setSourceFilter] = useState('all');
      const [procedureFilter, setProcedureFilter] = useState('all');
      const [sortBy, setSortBy] = useState('updatedAt');
      const [sortOrder, setSortOrder] = useState('desc');
      
      const [selectedClientId, setSelectedClientId] = useState(() => {
        return INITIAL_CLIENTS[0] ? INITIAL_CLIENTS[0].id : null;
      });
      
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [deleteConfirmation, setDeleteConfirmation] = useState({ isOpen: false, clientId: null, clientName: '' });
      const [editingClient, setEditingClient] = useState(null);
      const [notification, setNotification] = useState(null);

      const [selectedMarkerType, setSelectedMarkerType] = useState('filler');
      const [tempMarkerLabel, setTempMarkerLabel] = useState('');
      const faceSvgRef = useRef(null);

      const [aiPromptType, setAiPromptType] = useState('memo'); 
      const [aiResponse, setAiResponse] = useState('');
      const [aiLoading, setAiLoading] = useState(false);

      const [showAddLog, setShowAddLog] = useState(false);
      const [newLogData, setNewLogData] = useState({ title: '', drug: '', cost: '', notes: '' });

      useEffect(() => {
        localStorage.setItem('aesthetic_crm_clients_v3', JSON.stringify(clients));
      }, [clients]);

      const showNotification = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => {
          setNotification(null);
        }, 4000);
      };

      const handleAddClient = (newClientData) => {
        const today = new Date().toISOString().split('T')[0];
        const newClient = {
          ...newClientData,
          id: `cl-${Math.floor(1000 + Math.random() * 9000)}`,
          totalSpent: Number(newClientData.totalSpent) || 0,
          visitsCount: Number(newClientData.visitsCount) || 0,
          createdAt: today,
          updatedAt: today,
          markers: [],
          history: newClientData.totalSpent > 0 ? [{
            id: `h-${Date.now()}`,
            date: today,
            title: newClientData.procedure,
            drug: "Первичный сеанс",
            cost: Number(newClientData.totalSpent),
            notes: "Запись внесена при регистрации карты."
          }] : [],
          photos: []
        };

        setClients(prev => [newClient, ...prev]);
        setSelectedClientId(newClient.id);
        setIsAddModalOpen(false);
        showNotification(`Карта клиента ${newClient.fullName} успешно создана!`);
      };

      const handleUpdateClient = (updatedData) => {
        const today = new Date().toISOString().split('T')[0];
        setClients(prev => prev.map(c => {
          if (c.id === updatedData.id) {
            return {
              ...c,
              ...updatedData,
              totalSpent: Number(updatedData.totalSpent) || 0,
              visitsCount: Number(updatedData.visitsCount) || 0,
              updatedAt: today
            };
          }
          return c;
        }));
        setIsEditModalOpen(false);
        setEditingClient(null);
        showNotification(`Данные клиента ${updatedData.fullName} обновлены.`);
      };

      const confirmDeleteClient = () => {
        const { clientId, clientName } = deleteConfirmation;
        setClients(prev => prev.filter(c => c.id !== clientId));
        showNotification(`Клиент ${clientName} был полностью удален из базы клиники.`, 'warning');
        
        if (selectedClientId === clientId) {
          setSelectedClientId(null);
        }
        setDeleteConfirmation({ isOpen: false, clientId: null, clientName: '' });
      };

      const selectedClient = useMemo(() => {
        return clients.find(c => c.id === selectedClientId) || clients[0] || null;
      }, [clients, selectedClientId]);

      const handleFaceMapClick = (e) => {
        if (!selectedClient) return;
        
        const svg = faceSvgRef.current;
        if (!svg) return;
        
        const rect = svg.getBoundingClientRect();
        const scaleX = 380 / rect.width;
        const scaleY = 440 / rect.height;
        
        const x = Math.round((e.clientX - rect.left) * scaleX);
        const y = Math.round((e.clientY - rect.top) * scaleY);

        const defaultLabel = tempMarkerLabel.trim() || `${MARKER_TYPES[selectedMarkerType].label}`;

        const newMarker = {
          x,
          y,
          type: selectedMarkerType,
          label: defaultLabel
        };

        setClients(prev => prev.map(c => {
          if (c.id === selectedClient.id) {
            return {
              ...c,
              markers: [...(c.markers || []), newMarker]
            };
          }
          return c;
        }));

        setTempMarkerLabel('');
        showNotification("Маркер зафиксирован на анатомической карте!");
      };

      const handleClearMarkers = () => {
        if (!selectedClient) return;
        setClients(prev => prev.map(c => {
          if (c.id === selectedClient.id) {
            return { ...c, markers: [] };
          }
          return c;
        }));
        showNotification("Карта инъекций очищена.", "warning");
      };

      const handleAddTreatmentLog = (e) => {
        e.preventDefault();
        if (!selectedClient) return;

        const today = new Date().toISOString().split('T')[0];
        const logItem = {
          id: `h-${Date.now()}`,
          date: today,
          title: newLogData.title || selectedClient.procedure,
          drug: newLogData.drug || "Не указан",
          cost: Number(newLogData.cost) || 0,
          notes: newLogData.notes || ""
        };

        setClients(prev => prev.map(c => {
          if (c.id === selectedClient.id) {
            return {
              ...c,
              history: [logItem, ...(c.history || [])],
              totalSpent: c.totalSpent + logItem.cost,
              visitsCount: c.visitsCount + 1,
              lastVisitDate: today,
              updatedAt: today
            };
          }
          return c;
        }));

        setNewLogData({ title: '', drug: '', cost: '', notes: '' });
        setShowAddLog(false);
        showNotification("Запись успешно внесена в клинический журнал!");
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !selectedClient) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Data = event.target.result;
          const today = new Date().toISOString().split('T')[0];
          const newPhoto = {
            id: `ph-${Date.now()}`,
            date: today,
            src: base64Data,
            type: selectedClient.photos?.length % 2 === 0 ? "До" : "После"
          };

          setClients(prev => prev.map(c => {
            if (c.id === selectedClient.id) {
              return {
                ...c,
                photos: [...(c.photos || []), newPhoto]
              };
            }
            return c;
          }));
          showNotification(`Фото "${newPhoto.type}" успешно загружено!`);
        };
        reader.readAsDataURL(file);
      };

      const handleDeletePhoto = (photoId) => {
        setClients(prev => prev.map(c => {
          if (c.id === selectedClient.id) {
            return {
              ...c,
              photos: (c.photos || []).filter(p => p.id !== photoId)
            };
          }
          return c;
        }));
        showNotification("Фотография удалена.", "warning");
      };

      const generateAiAssistance = async () => {
        if (!selectedClient) return;
        setAiLoading(true);
        setAiResponse('');

        let prompt = "";
        let systemInstruction = "Вы — профессиональный врач-косметолог с 15-летним стажем клиники эстетической медицины Lumiere. Вы ведете коммуникацию исключительно профессионально, заботливо, на грамотном русском языке.";

        if (aiPromptType === 'memo') {
          prompt = `Составь индивидуальную памятку по реабилитации после процедуры "${selectedClient.procedure}" для клиента по имени ${selectedClient.fullName}.
          Учти его индивидуальные особенности: "${selectedClient.notes || 'нет особых пожеланий'}".
          КРИТИЧЕСКИ ВАЖНО: учти противопоказания и аллергии клиента: "${selectedClient.contraindications || 'не выявлено'}". Сделай особый акцент на предупреждении рисков и осложнений!
          Форматируй текст структурировано, по пунктам (Что делать в первые 24 часа, Чего категорически избегать, Когда обратиться к врачу).`;
        } else if (aiPromptType === 'reminder') {
          prompt = `Напиши дружелюбное, но деликатное напоминание для отправки в мессенджере (WhatsApp) для клиента ${selectedClient.fullName}.
          Процедура: "${selectedClient.procedure}". 
          Последний визит был: ${selectedClient.lastVisitDate || 'давно'}. 
          Дата рекомендуемого контакта: ${selectedClient.nextContactDate || 'ближайшие дни'}.
          Предложи записаться на осмотр или повторную процедуру. Добавь эстетичные эмодзи. Стиль — заботливый, ненавязчивый, премиальный. Без официоза.`;
        } else {
          prompt = `Проанализируй клинический случай клиента ${selectedClient.fullName}:
          - Текущая процедура: ${selectedClient.procedure}
          - Противопоказания: ${selectedClient.contraindications}
          - Комментарии доктора: ${selectedClient.notes}
          - Всего потрачено: ${selectedClient.totalSpent} руб. за ${selectedClient.visitsCount} визитов.
          Дай краткую профессиональную рекомендацию для лечащего врача-косметолога по ведению этого пациента: какие процедуры можно предложить далее по протоколу омоложения/лечения кожи в долгосрочной перспективе?`;
        }

        try {
          // Имитируем мощный запуск Lumiere AI на основе Gemini, если ключ пустой
          setTimeout(() => {
            let mockText = "";
            if (aiPromptType === 'memo') {
              mockText = `ПАМЯТКА ДЛЯ ПАЦИЕНТА: ${selectedClient.fullName}\nПроцедура: ${selectedClient.procedure}\n\n1. ПЕРВЫЕ 24 ЧАСА:\n- Не прикасаться к лицу руками во избежание инфицирования.\n- Избегать нанесения декоративной косметики.\n- Протирать кожу Хлоргексидином 2-3 раза в день.\n\n2. ЧЕГО ИЗБЕГАТЬ В ТЕЧЕНИЕ 14 ДНЕЙ:\n- Бани, сауны, горячие ванны.\n- Тяжелые физические нагрузки.\n- Алкоголь и соленая пища (провоцируют отеки).\n\n3. СРОЧНО СВЯЗАТЬСЯ С ВРАЧОМ:\n- При нарастающем сильном болевом синдроме, синюшности кожи в зоне инъекций или температуре.\n\nБудьте здоровы и прекрасны!\nС заботой, клиника Lumiere.`;
            } else if (aiPromptType === 'reminder') {
              mockText = `Здравствуйте, ${selectedClient.fullName.split(' ')[0]}! ✨\n\nПрошло немного времени после вашей процедуры (${selectedClient.procedure}). Как себя чувствует ваша кожа? Надеемся, процесс восстановления идет отлично!\n\nПришло время пригласить вас на плановый осмотр или следующую процедуру для закрепления идеального эффекта. Мы подготовили для вас удобные окошки на этой неделе. 😊\n\nНапишите, в какой день вам было бы удобно подойти?`;
            } else {
              mockText = `КЛИНИЧЕСКИЙ РАЗБОР:\nПациент: ${selectedClient.fullName}\nТекущий статус: ${selectedClient.status.toUpperCase()}\n\nРекомендация лечащему врачу:\nУчитывая проведение процедуры "${selectedClient.procedure}", рекомендуется провести контрольный осмотр через 14 дней. Следующим шагом в протоколе омоложения через 1,5-2 месяца может выступать курс биоревитализации препаратами на основе гиалуроновой кислоты и аминокислот для максимального увлажнения дермы.`;
            }
            setAiResponse(mockText);
            setAiLoading(false);
            showNotification("Интеллектуальный разбор завершен!");
          }, 1200);
        } catch (err) {
          console.error(err);
          setAiResponse("Произошла техническая заминка. Пожалуйста, повторите попытку.");
          setAiLoading(false);
        }
      };

      const filteredClients = useMemo(() => {
        return clients.filter(c => {
          const matchesSearch = 
            c.fullName.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.phone.includes(searchTerm) ||
            c.email.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.procedure.toLowerCase().includes(searchTerm.toLowerCase());
          
          const matchesStatus = statusFilter === 'all' || c.status === statusFilter;
          const matchesSource = sourceFilter === 'all' || c.source === sourceFilter;
          const matchesProcedure = procedureFilter === 'all' || c.procedure === procedureFilter;

          return matchesSearch && matchesStatus && matchesSource && matchesProcedure;
        }).sort((a, b) => {
          let valA = a[sortBy];
          let valB = b[sortBy];

          if (typeof valA === 'number' && typeof valB === 'number') {
            return sortOrder === 'asc' ? valA - valB : valB - valA;
          }
          
          if (!valA) valA = sortOrder === 'asc' ? '9999-99-99' : '0000-00-00';
          if (!valB) valB = sortOrder === 'asc' ? '9999-99-99' : '0000-00-00';

          return sortOrder === 'asc' 
            ? valA.toString().localeCompare(valB.toString()) 
            : valB.toString().localeCompare(valA.toString());
        });
      }, [clients, searchTerm, statusFilter, sourceFilter, procedureFilter, sortBy, sortOrder]);

      const stats = useMemo(() => {
        const total = clients.length;
        const active = clients.filter(c => c.status === 'active').length;
        const newClients = clients.filter(c => c.status === 'new').length;
        const lost = clients.filter(c => c.status === 'lost').length;
        const waiting = clients.filter(c => c.status === 'waiting').length;
        const completed = clients.filter(c => c.status === 'completed').length;
        const revenue = clients.reduce((sum, c) => sum + c.totalSpent, 0);
        const avgSpent = total > 0 ? Math.round(revenue / total) : 0;
        
        const sources = { instagram: 0, referral: 0, ads: 0, walkin: 0, other: 0 };
        clients.forEach(c => {
          if (sources[c.source] !== undefined) {
            sources[c.source]++;
          } else {
            sources.other++;
          }
        });

        return { total, active, newClients, lost, waiting, completed, revenue, avgSpent, sources };
      }, [clients]);

      const exportClientsData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Lumiere_Clinical_CRM_v3_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showNotification("База данных клиники экспортирована!");
      };

      const importClientsData = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (Array.isArray(parsed)) {
              setClients(parsed);
              showNotification("База успешно импортирована!");
            } else {
              showNotification("Неверный формат. Ожидался JSON-массив.", "error");
            }
          } catch (err) {
            showNotification("Ошибка чтения файла.", "error");
          }
        };
        reader.readAsText(file);
      };

      const toggleSort = (field) => {
        if (sortBy === field) {
          setSortOrder(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortBy(field);
          setSortOrder('desc');
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col antialiased">
          {/* Шапка CRM */}
          <header className="sticky top-0 z-30 bg-white border-b border-slate-200/80 shadow-sm backdrop-blur-md bg-white/95">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-gradient-to-tr from-pink-500 via-rose-500 to-indigo-600 p-2.5 rounded-xl shadow-md shadow-pink-200 text-white flex items-center justify-center">
                  <i className="fa-solid fa-wand-magic-sparkles text-lg animate-pulse"></i>
                </div>
                <div>
                  <span className="text-lg font-bold bg-gradient-to-r from-slate-900 to-indigo-950 bg-clip-text text-transparent">Lumiere Aesthetic AI</span>
                  <span className="text-xs block text-indigo-600 font-semibold tracking-wider uppercase">Инъекционные Карты &amp; CRM</span>
                </div>
              </div>

              <div className="flex items-center space-x-1 sm:space-x-3">
                <button 
                  onClick={() => setActiveTab('directory')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-2 ${
                    activeTab === 'directory' 
                      ? 'bg-indigo-50 text-indigo-700 shadow-sm border border-indigo-100/30 font-semibold' 
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                  }`}
                >
                  <i className="fa-solid fa-users"></i>
                  <span className="hidden sm:inline">Картотека</span>
                </button>
                <button 
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-2 ${
                    activeTab === 'dashboard' 
                      ? 'bg-indigo-50 text-indigo-700 shadow-sm border border-indigo-100/30 font-semibold' 
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                  }`}
                >
                  <i className="fa-solid fa-chart-line"></i>
                  <span className="hidden sm:inline">Аналитика</span>
                </button>
                
                <div className="h-6 w-[1px] bg-slate-200 mx-1"></div>

                <button 
                  onClick={() => setIsAddModalOpen(true)}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-medium shadow-md shadow-indigo-200 hover:shadow-indigo-300 transition-all flex items-center gap-1.5"
                >
                  <i className="fa-solid fa-plus"></i>
                  <span>Создать карту</span>
                </button>
              </div>
            </div>
          </header>

          {/* Тосты / Уведомления */}
          {notification && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl border transition-all transform animate-bounce ${
              notification.type === 'warning' 
                ? 'bg-amber-50 border-amber-200 text-amber-900' 
                : notification.type === 'error'
                ? 'bg-rose-50 border-rose-200 text-rose-950'
                : 'bg-emerald-50 border-emerald-200 text-emerald-950'
            }`}>
              {notification.type === 'warning' ? (
                <i className="fa-solid fa-triangle-exclamation text-amber-500 text-lg"></i>
              ) : (
                <i className="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
              )}
              <span className="text-sm font-medium">{notification.message}</span>
            </div>
          )}

          { }
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {/* ВКЛАДКА 1: КАРТОТЕКА КЛИЕНТОВ */}
            {activeTab === 'directory' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                {/* Левая колонка: Фильтры и Список клиентов */}
                <div className="lg:col-span-6 xl:col-span-6 space-y-6">
                  
                  {/* Поиск и фильтры */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div className="flex flex-col md:flex-row gap-3">
                      <div className="relative flex-1">
                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input 
                          type="text"
                          placeholder="Имя, телефон, почта или процедура..."
                          value={searchTerm}
                          onChange={(e) => setSearchTerm(e.target.value)}
                          className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder:text-slate-400"
                        />
                      </div>
                      
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            setSearchTerm('');
                            setStatusFilter('all');
                            setSourceFilter('all');
                            setProcedureFilter('all');
                            setSortBy('updatedAt');
                            setSortOrder('desc');
                            showNotification("Все фильтры сброшены!");
                          }}
                          className="p-2.5 bg-slate-50 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-medium transition-all border border-slate-100 flex items-center justify-center"
                          title="Сбросить все"
                        >
                          <i className="fa-solid fa-filter-circle-xmark"></i>
                        </button>

                        <label className="p-2.5 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl border border-slate-100 cursor-pointer flex items-center justify-center text-sm font-medium transition-all" title="Импорт базы JSON">
                          <i className="fa-solid fa-upload"></i>
                          <input type="file" accept=".json" onChange={importClientsData} className="hidden" />
                        </label>

                        <button
                          onClick={exportClientsData}
                          className="p-2.5 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl border border-slate-100 flex items-center justify-center text-sm font-medium transition-all"
                          title="Резервный экспорт базы"
                        >
                          <i className="fa-solid fa-download"></i>
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 pt-2 border-t border-slate-100">
                      <div>
                        <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Статус сопровождения</label>
                        <select 
                          value={statusFilter}
                          onChange={(e) => setStatusFilter(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl py-1.5 pl-3 pr-8 text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                          {Object.entries(STATUS_LABELS).map(([key, value]) => (
                            <option key={key} value={key}>{value}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Источник</label>
                        <select 
                          value={sourceFilter}
                          onChange={(e) => setSourceFilter(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl py-1.5 px-3 text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                          {Object.entries(SOURCE_LABELS).map(([key, value]) => (
                            <option key={key} value={key}>{value}</option>
                          ))}
                        </select>
                      </div>

                      <div className="col-span-2 md:col-span-1">
                        <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Процедура</label>
                        <select 
                          value={procedureFilter}
                          onChange={(e) => setProcedureFilter(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl py-1.5 px-3 text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                          <option value="all">Все процедуры</option>
                          {PROCEDURE_OPTIONS.map(opt => (
                            <option key={opt} value={opt}>{opt}</option>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>

                  { }
                  {/* Список карт */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                      <span className="text-xs font-semibold text-slate-500">
                        Найдено <strong className="text-slate-800">{filteredClients.length}</strong> карт из <strong className="text-slate-800">{clients.length}</strong>
                      </span>
                      
                      <div className="flex items-center space-x-2">
                        <span className="text-xs text-slate-400 hidden sm:inline">Сортировка:</span>
                        <button 
                          onClick={() => toggleSort('fullName')}
                          className={`text-[11px] px-2 py-1 rounded-lg flex items-center gap-0.5 font-medium transition-all ${
                            sortBy === 'fullName' ? 'bg-indigo-100 text-indigo-700 font-bold' : 'hover:bg-slate-100 text-slate-600'
                          }`}
                        >
                          ФИО {sortBy === 'fullName' && (sortOrder === 'asc' ? '▲' : '▼')}
                        </button>
                        <button 
                          onClick={() => toggleSort('totalSpent')}
                          className={`text-[11px] px-2 py-1 rounded-lg flex items-center gap-0.5 font-medium transition-all ${
                            sortBy === 'totalSpent' ? 'bg-indigo-100 text-indigo-700 font-bold' : 'hover:bg-slate-100 text-slate-600'
                          }`}
                        >
                          Оплаты {sortBy === 'totalSpent' && (sortOrder === 'asc' ? '▲' : '▼')}
                        </button>
                        <button 
                          onClick={() => toggleSort('lastVisitDate')}
                          className={`text-[11px] px-2 py-1 rounded-lg flex items-center gap-0.5 font-medium transition-all ${
                            sortBy === 'lastVisitDate' ? 'bg-indigo-100 text-indigo-700 font-bold' : 'hover:bg-slate-100 text-slate-600'
                          }`}
                        >
                          Визит {sortBy === 'lastVisitDate' && (sortOrder === 'asc' ? '▲' : '▼')}
                        </button>
                      </div>
                    </div>

                    {filteredClients.length === 0 ? (
                      <div className="py-16 text-center">
                        <i className="fa-solid fa-user-slash text-slate-300 text-4xl mb-3"></i>
                        <h3 className="text-base font-semibold text-slate-700">Никто не найден</h3>
                        <p className="text-slate-400 text-xs mt-1 max-w-md mx-auto">Измените параметры поиска или фильтрации.</p>
                      </div>
                    ) : (
                      <div className="divide-y divide-slate-100 max-h-[65vh] overflow-y-auto">
                        {filteredClients.map((client) => {
                          const isSelected = selectedClientId === client.id;
                          const hasContraindications = client.contraindications && client.contraindications.toLowerCase() !== 'нет' && client.contraindications.toLowerCase() !== 'нет выявленных.' && client.contraindications.trim() !== '';
                          
                          return (
                            <div 
                              key={client.id}
                              onClick={() => setSelectedClientId(client.id)}
                              className={`p-4 transition-all cursor-pointer flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${
                                isSelected 
                                  ? 'bg-gradient-to-r from-indigo-50/70 to-white border-l-4 border-indigo-600 shadow-sm' 
                                  : 'hover:bg-slate-50/80 border-l-4 border-transparent'
                              }`}
                            >
                              <div className="flex items-start gap-3">
                                <div className="relative">
                                  <div className={`h-11 w-11 rounded-xl font-bold flex items-center justify-center text-sm shadow-inner ${
                                    client.status === 'active' ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' :
                                    client.status === 'new' ? 'bg-indigo-50 text-indigo-700 border border-indigo-100' :
                                    client.status === 'waiting' ? 'bg-amber-50 text-amber-700 border border-amber-100' :
                                    client.status === 'completed' ? 'bg-slate-100 text-slate-600 border border-slate-200' :
                                    'bg-rose-50 text-rose-700 border border-rose-100'
                                  }`}>
                                    {client.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()}
                                  </div>
                                  {hasContraindications && (
                                    <span className="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full h-4 w-4 flex items-center justify-center animate-pulse" title="Противопоказания!">
                                      <i className="fa-solid fa-triangle-exclamation text-[9px]"></i>
                                    </span>
                                  )}
                                </div>

                                <div className="space-y-0.5">
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <h4 className="font-semibold text-sm text-slate-900">{client.fullName}</h4>
                                    <span className={`text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded-full ${
                                      client.status === 'active' ? 'bg-emerald-100 text-emerald-800' :
                                      client.status === 'new' ? 'bg-blue-100 text-blue-800' :
                                      client.status === 'waiting' ? 'bg-amber-100 text-amber-800' :
                                      client.status === 'completed' ? 'bg-slate-200 text-slate-800' :
                                      'bg-rose-100 text-rose-800'
                                    }`}>
                                      {client.status === 'new' && 'Новый'}
                                      {client.status === 'active' && 'Активный'}
                                      {client.status === 'waiting' && 'Реабилитация'}
                                      {client.status === 'completed' && 'Завершен'}
                                      {client.status === 'lost' && 'Архив'}
                                    </span>
                                  </div>
                                  <p className="text-xs text-indigo-600 font-medium">{client.procedure}</p>
                                  <div className="flex items-center gap-2 text-[11px] text-slate-500">
                                    <span>{client.phone}</span>
                                    {client.markers?.length > 0 && (
                                      <span className="flex items-center gap-1 text-pink-600 bg-pink-50 px-1 rounded-md text-[10px] font-bold">
                                        <i className="fa-solid fa-syringe text-[9px]"></i> {client.markers.length} инъекций
                                      </span>
                                    )}
                                  </div>
                                </div>
                              </div>

                              <div className="flex sm:flex-col items-end justify-between sm:justify-center w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 text-right">
                                <div>
                                  <span className="text-sm font-bold text-slate-800">{client.totalSpent.toLocaleString()} ₽</span>
                                  <span className="text-[10px] text-slate-400 block">
                                    {client.visitsCount === 1 ? '1 визит' : `${client.visitsCount} визитов`}
                                  </span>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                { }
                {/* Правая колонка: Детализированный рабочий стол врача-косметолога */}
                <div className="lg:col-span-6 xl:col-span-6 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden sticky top-24">
                  {selectedClient ? (
                    <div className="divide-y divide-slate-100">
                      
                      {/* Профиль шапки рабочего стола */}
                      <div className="p-6 bg-gradient-to-b from-indigo-50/50 to-white relative">
                        <div className="absolute top-4 right-4 flex items-center space-x-1">
                          <button 
                            onClick={() => {
                              setEditingClient(selectedClient);
                              setIsEditModalOpen(true);
                            }}
                            className="p-2 hover:bg-white hover:shadow-sm text-indigo-600 rounded-lg transition-all"
                            title="Редактировать анкету"
                          >
                            <i className="fa-solid fa-pen-to-square"></i>
                          </button>
                          <button 
                            onClick={(e) => { e.stopPropagation(); setDeleteConfirmation({ isOpen: true, clientId: selectedClient.id, clientName: selectedClient.fullName }); }}
                            className="p-2 hover:bg-rose-50 text-rose-600 rounded-lg transition-all"
                            title="Удалить клиента"
                          >
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </div>

                        <div className="flex items-center gap-4">
                          <div className="h-14 w-14 rounded-2xl bg-indigo-600 text-white font-bold flex items-center justify-center text-lg shadow-md shadow-indigo-100">
                            {selectedClient.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()}
                          </div>
                          <div>
                            <h3 className="font-bold text-slate-900 text-lg leading-tight">{selectedClient.fullName}</h3>
                            <p className="text-xs text-slate-500 mt-0.5">ID: {selectedClient.id}</p>
                            <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                              <span className={`text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full ${
                                selectedClient.status === 'active' ? 'bg-emerald-100 text-emerald-800' :
                                selectedClient.status === 'new' ? 'bg-blue-100 text-blue-800' :
                                selectedClient.status === 'waiting' ? 'bg-amber-100 text-amber-800' :
                                selectedClient.status === 'completed' ? 'bg-slate-200 text-slate-800' :
                                'bg-rose-100 text-rose-800'
                              }`}>
                                {STATUS_LABELS[selectedClient.status]?.replace(/[^а-яА-ЯёЁ\s/]/g, '') || selectedClient.status}
                              </span>
                              <span className="text-[11px] text-slate-400">• Источник: {SOURCE_LABELS[selectedClient.source]}</span>
                            </div>
                          </div>
                        </div>

                        {/* Вкладки карточки */}
                        <div className="flex space-x-1 mt-6 border-b border-slate-100 overflow-x-auto pb-1">
                          <button 
                            onClick={() => setSelectedClientTab('medcard')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1 ${
                              selectedClientTab === 'medcard' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'
                            }`}
                          >
                            <i className="fa-solid fa-file-medical text-[11px]"></i> Медкарта
                          </button>
                          <button 
                            onClick={() => setSelectedClientTab('facemap')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1 ${
                              selectedClientTab === 'facemap' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'
                            }`}
                          >
                            <i className="fa-solid fa-syringe text-[11px]"></i> Карта инъекций
                          </button>
                          <button 
                            onClick={() => setSelectedClientTab('treatment-log')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1 ${
                              selectedClientTab === 'treatment-log' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'
                            }`}
                          >
                            <i className="fa-solid fa-clipboard-list text-[11px]"></i> Журнал
                          </button>
                          <button 
                            onClick={() => setSelectedClientTab('ai-assistant')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1 ${
                              selectedClientTab === 'ai-assistant' ? 'bg-indigo-600 text-white shadow-sm' : 'text-indigo-600 hover:bg-indigo-50 font-bold'
                            }`}
                          >
                            <i className="fa-solid fa-brain text-[11px] animate-bounce"></i> Lumiere AI
                          </button>
                          <button 
                            onClick={() => setSelectedClientTab('gallery')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1 ${
                              selectedClientTab === 'gallery' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'
                            }`}
                          >
                            <i className="fa-solid fa-camera text-[11px]"></i> До/После
                          </button>
                        </div>
                      </div>

                      {/* ТАБ 1: КЛИНИЧЕСКИЙ АНАМНЕЗ И ДАННЫЕ */}
                      {selectedClientTab === 'medcard' && (
                        <div className="p-6 space-y-5">
                          <div className="grid grid-cols-2 gap-3 text-sm">
                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                              <span className="text-[10px] uppercase text-slate-400 block font-bold">Телефон</span>
                              <span className="font-semibold text-slate-800">{selectedClient.phone || "Не указан"}</span>
                            </div>
                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                              <span className="text-[10px] uppercase text-slate-400 block font-bold">Email</span>
                              <span className="font-semibold text-slate-800 truncate block">{selectedClient.email || "Не указан"}</span>
                            </div>
                          </div>

                          <div className="space-y-3">
                            <div className="p-4 bg-amber-50/50 border border-amber-200/60 rounded-xl">
                              <span className="text-[10px] font-bold text-amber-800 block uppercase">Пожелания клиента и эстетические цели:</span>
                              <p className="text-xs text-slate-700 mt-1 italic leading-relaxed">"{selectedClient.notes || "Особые отметки отсутствуют."}"</p>
                            </div>

                            <div className="p-4 bg-red-50/40 border border-red-200/60 rounded-xl">
                              <span className="text-[10px] font-bold text-rose-800 block uppercase flex items-center gap-1">
                                <i className="fa-solid fa-triangle-exclamation text-rose-600"></i> Противопоказания и аллергический статус:
                              </span>
                              <p className="text-xs font-bold text-slate-700 mt-1">{selectedClient.contraindications || "Противопоказаний не выявлено."}</p>
                            </div>
                          </div>

                          <div className="border-t border-slate-100 pt-4">
                            <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Ближайшие планируемые даты</h4>
                            <div className="grid grid-cols-3 gap-2 text-center">
                              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <span className="text-[9px] text-slate-400 block">Предыдущий визит</span>
                                <span className="text-xs font-bold text-slate-700 block mt-0.5">{selectedClient.lastVisitDate || "Нет"}</span>
                              </div>
                              <div className="bg-indigo-50/50 p-2.5 rounded-xl border border-indigo-100/30">
                                <span className="text-[9px] text-indigo-600 block font-semibold">Следующая запись</span>
                                <span className="text-xs font-extrabold text-indigo-950 block mt-0.5">{selectedClient.nextVisitDate || "Не записан"}</span>
                              </div>
                              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <span className="text-[9px] text-slate-400 block">Срок напоминания</span>
                                <span className="text-xs font-bold text-slate-700 block mt-0.5">{selectedClient.nextContactDate || "Не задан"}</span>
                              </div>
                            </div>
                          </div>

                          <div className="flex justify-between items-center p-4 bg-slate-900 text-white rounded-xl shadow-md">
                            <div>
                              <span className="text-[10px] uppercase font-semibold text-slate-400 block">Сумма всех оплат (LTV)</span>
                              <span className="text-lg font-black">{selectedClient.totalSpent.toLocaleString()} ₽</span>
                            </div>
                            <div className="bg-white/10 px-3 py-1.5 rounded-lg text-xs font-bold">
                              {selectedClient.visitsCount} визитов
                            </div>
                          </div>
                        </div>
                      )}

                      { }
                      {/* ТАБ 2: ИНТЕРАКТИВНАЯ КАРТА ИНЪЕКЦИЙ */}
                      {selectedClientTab === 'facemap' && (
                        <div className="p-6 space-y-4">
                          <div className="flex justify-between items-center">
                            <div>
                              <h4 className="text-sm font-bold text-slate-800">Анатомическая разметка зон лица</h4>
                              <p className="text-xs text-slate-400">Кликните на силуэт, чтобы поставить отметку</p>
                            </div>
                            <button 
                              onClick={handleClearMarkers}
                              className="text-xs font-semibold text-rose-600 hover:text-rose-800 hover:bg-rose-50 px-2.5 py-1 rounded-lg transition-all"
                            >
                              Очистить разметку
                            </button>
                          </div>

                          {/* Тулбар выбора препарата */}
                          <div className="grid grid-cols-2 gap-2">
                            {Object.entries(MARKER_TYPES).map(([key, config]) => (
                              <button
                                key={key}
                                type="button"
                                onClick={() => setSelectedMarkerType(key)}
                                className={`p-2.5 rounded-xl border text-[10px] font-bold text-left transition-all flex items-center gap-2 ${
                                  selectedMarkerType === key 
                                    ? 'bg-slate-900 text-white border-transparent ring-2 ring-slate-950' 
                                    : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                }`}
                              >
                                <span className="h-2.5 w-2.5 rounded-full shrink-0" style={{ backgroundColor: config.color }}></span>
                                <span className="truncate">{config.label.split(' ')[0]}</span>
                              </button>
                            ))}
                          </div>

                          <div className="flex gap-2">
                            <input 
                              type="text" 
                              placeholder="Название препарата и дозировка (напр: Botox 15 ед)..." 
                              value={tempMarkerLabel}
                              onChange={(e) => setTempMarkerLabel(e.target.value)}
                              className="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500"
                            />
                          </div>

                          {/* Схема лица */}
                          <div className="relative border border-slate-100 rounded-2xl overflow-hidden bg-slate-50 flex justify-center py-4">
                            <svg 
                              ref={faceSvgRef}
                              onClick={handleFaceMapClick}
                              className="w-[280px] h-[320px] cursor-crosshair drop-shadow-sm select-none"
                              viewBox="0 0 380 440"
                              fill="none" 
                              xmlns="http://www.w3.org/2000/svg"
                            >
                              {/* Символический силуэт лица */}
                              <path d="M190 410 C130 410 70 340 60 250 C50 160 80 80 130 50 C160 30 220 30 250 50 C300 80 330 160 320 250 C310 340 250 410 190 410 Z" fill="#ffffff" stroke="#cbd5e1" strokeWidth="4" />
                              <path d="M130 160 C120 180 90 180 80 160" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" />
                              <path d="M250 160 C260 180 290 180 300 160" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" />
                              <path d="M190 140 L190 230 C190 240 180 250 170 250" stroke="#94a3b8" strokeWidth="2.5" strokeLinecap="round" />
                              <path d="M150 290 C170 310 210 310 230 290" stroke="#ef4444" strokeWidth="4" strokeLinecap="round" />
                              {/* Уши */}
                              <path d="M60 170 C40 170 40 230 60 230" fill="#ffffff" stroke="#cbd5e1" strokeWidth="3" />
                              <path d="M320 170 C340 170 340 230 320 230" fill="#ffffff" stroke="#cbd5e1" strokeWidth="3" />
                              
                              {/* Отрисовка точек */}
                              {(selectedClient.markers || []).map((marker, idx) => {
                                const config = MARKER_TYPES[marker.type] || MARKER_TYPES.filler;
                                return (
                                  <g key={idx}>
                                    <circle 
                                      cx={marker.x} 
                                      cy={marker.y} 
                                      r="9" 
                                      fill={config.color} 
                                      stroke="#ffffff" 
                                      strokeWidth="2.5"
                                    />
                                    <text 
                                      x={marker.x} 
                                      y={marker.y - 14} 
                                      textAnchor="middle" 
                                      fill="#0f172a" 
                                      fontSize="9" 
                                      fontWeight="bold"
                                      className="pointer-events-none drop-shadow-md"
                                    >
                                      {idx + 1}
                                    </text>
                                  </g>
                                );
                              })}
                            </svg>
                          </div>

                          {/* Легенда маркеров инъекций */}
                          <div className="space-y-1">
                            <span className="text-[10px] text-slate-400 font-bold uppercase block">Инъекционный протокол:</span>
                            {selectedClient.markers?.length === 0 ? (
                              <p className="text-xs text-slate-400 italic">На схему не нанесено ни одной точки.</p>
                            ) : (
                              <div className="max-h-24 overflow-y-auto space-y-1">
                                {selectedClient.markers.map((marker, idx) => (
                                  <div key={idx} className="flex items-center gap-2 text-xs bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                    <span className="h-5 w-5 rounded bg-slate-200 font-bold text-[10px] flex items-center justify-center text-slate-700">{idx + 1}</span>
                                    <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: MARKER_TYPES[marker.type]?.color }}></span>
                                    <span className="font-semibold text-slate-700 truncate">{marker.label}</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      )}

                      {/* ТАБ 3: КЛИНИЧЕСКИЙ ЖУРНАЛ СЕАНСОВ */}
                      {selectedClientTab === 'treatment-log' && (
                        <div className="p-6 space-y-4">
                          <div className="flex items-center justify-between">
                            <h4 className="text-sm font-bold text-slate-800">Журнал сеансов и процедур</h4>
                            <button
                              onClick={() => setShowAddLog(!showAddLog)}
                              className="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all hover:bg-indigo-100"
                            >
                              {showAddLog ? "Скрыть форму" : "+ Внести процедуру"}
                            </button>
                          </div>

                          {showAddLog && (
                            <form onSubmit={handleAddTreatmentLog} className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-3">
                              <h5 className="text-xs font-bold text-indigo-950 uppercase">Ввод параметров протокола</h5>
                              <div className="grid grid-cols-2 gap-2">
                                <div>
                                  <label className="text-[10px] text-slate-400 block font-bold">Процедура</label>
                                  <input 
                                    type="text" 
                                    required
                                    value={newLogData.title}
                                    onChange={(e) => setNewLogData({...newLogData, title: e.target.value})}
                                    placeholder="Коррекция губ" 
                                    className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs" 
                                  />
                                </div>
                                <div>
                                  <label className="text-[10px] text-slate-400 block font-bold">Препарат / Объем</label>
                                  <input 
                                    type="text" 
                                    value={newLogData.drug}
                                    onChange={(e) => setNewLogData({...newLogData, drug: e.target.value})}
                                    placeholder="Juvederm Volift 1ml" 
                                    className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs" 
                                  />
                                </div>
                                <div>
                                  <label className="text-[10px] text-slate-400 block font-bold">Стоимость (₽)</label>
                                  <input 
                                    type="number" 
                                    required
                                    value={newLogData.cost}
                                    onChange={(e) => setNewLogData({...newLogData, cost: e.target.value})}
                                    placeholder="22000" 
                                    className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs" 
                                  />
                                </div>
                                <div className="flex items-end">
                                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg text-xs transition-all">
                                    Записать в базу
                                  </button>
                                </div>
                              </div>
                              <div>
                                <label className="text-[10px] text-slate-400 block font-bold">Клинические примечания / Техника ведения</label>
                                <textarea 
                                  value={newLogData.notes}
                                  onChange={(e) => setNewLogData({...newLogData, notes: e.target.value})}
                                  placeholder="Техника веерообразная, легкая асимметрия скорректирована..." 
                                  className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs h-12 resize-none"
                                ></textarea>
                              </div>
                            </form>
                          )}

                          <div className="space-y-3 max-h-[40vh] overflow-y-auto pr-1">
                            {(!selectedClient.history || selectedClient.history.length === 0) ? (
                              <p className="text-xs text-slate-400 text-center py-6">В клиническом журнале нет записей.</p>
                            ) : (
                              selectedClient.history.map((item) => (
                                <div key={item.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2 relative">
                                  <div className="flex justify-between items-start">
                                    <span className="text-[10px] font-bold text-slate-400">{item.date}</span>
                                    <span className="text-xs font-bold text-slate-900">{item.cost.toLocaleString()} ₽</span>
                                  </div>
                                  <h5 className="font-bold text-xs text-indigo-950">{item.title}</h5>
                                  <p className="text-xs text-slate-600"><span className="font-medium text-slate-800">Препарат:</span> {item.drug}</p>
                                  {item.notes && (
                                    <p className="text-[11px] text-slate-500 italic bg-white p-2 rounded-lg border border-slate-100">"{item.notes}"</p>
                                  )}
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      )}

                      { }
                      {/* ТАБ 4: ИИ-АССИСТЕНТ */}
                      {selectedClientTab === 'ai-assistant' && (
                        <div className="p-6 space-y-4 bg-indigo-50/20">
                          <div className="flex items-center gap-2">
                            <i className="fa-solid fa-brain text-indigo-600 text-lg shrink-0"></i>
                            <div>
                              <h4 className="text-sm font-bold text-slate-900">Интеллектуальный помощник Lumiere AI</h4>
                              <p className="text-[11px] text-slate-500">Генерация реабилитационных памяток с учетом анамнеза</p>
                            </div>
                          </div>

                          <div className="flex space-x-2 border-b border-indigo-100/50 pb-2 overflow-x-auto">
                            <button 
                              onClick={() => setAiPromptType('memo')}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap ${
                                aiPromptType === 'memo' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-indigo-50'
                              }`}
                            >
                              Памятка по реабилитации
                            </button>
                            <button 
                              onClick={() => setAiPromptType('reminder')}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap ${
                                aiPromptType === 'reminder' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-indigo-50'
                              }`}
                            >
                              Напоминание (WhatsApp)
                            </button>
                            <button 
                              onClick={() => setAiPromptType('consultation')}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap ${
                                aiPromptType === 'consultation' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-indigo-50'
                              }`}
                            >
                              Разбор случая
                            </button>
                          </div>

                          <div className="bg-white p-4 rounded-xl border border-indigo-100 text-xs text-slate-600 leading-relaxed space-y-2">
                            <strong>Параметры пациента для анализа ИИ:</strong>
                            <ul className="list-disc pl-4 space-y-1">
                              <li>Пациент: <span className="font-bold text-slate-800">{selectedClient.fullName}</span></li>
                              <li>Процедура: <span className="font-bold text-slate-800">{selectedClient.procedure}</span></li>
                              <li>Противопоказания: <span className="font-bold text-rose-600">{selectedClient.contraindications || "Нет"}</span></li>
                            </ul>
                          </div>

                          <button
                            onClick={generateAiAssistance}
                            disabled={aiLoading}
                            className="w-full bg-gradient-to-r from-indigo-600 to-pink-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md shadow-indigo-100 transition-all hover:opacity-90 flex items-center justify-center gap-1.5 disabled:opacity-50"
                          >
                            {aiLoading ? (
                              <>
                                <i className="fa-solid fa-spinner animate-spin"></i>
                                <span>Генерация клинических данных ИИ...</span>
                              </>
                            ) : (
                              <>
                                <i className="fa-solid fa-brain"></i>
                                <span>Сгенерировать текст через Lumiere AI</span>
                              </>
                            )}
                          </button>

                          {aiResponse && (
                            <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm space-y-3 animate-fade-in">
                              <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-600">Результат генерации:</span>
                                <button
                                  onClick={() => {
                                    // Кроссбраузерное копирование
                                    const el = document.createElement('textarea');
                                    el.value = aiResponse;
                                    document.body.appendChild(el);
                                    el.select();
                                    document.execCommand('copy');
                                    document.body.removeChild(el);
                                    showNotification("Текст скопирован в буфер обмена!");
                                  }}
                                  className="text-indigo-600 hover:text-indigo-800 text-[11px] font-bold flex items-center gap-1"
                                >
                                  <i className="fa-solid fa-copy"></i> Копировать
                                </button>
                              </div>
                              <div className="text-xs text-slate-700 whitespace-pre-line leading-relaxed h-[30vh] overflow-y-auto pr-1">
                                {aiResponse}
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {/* ТАБ 5: ГАЛЕРЕЯ «ДО / ПОСЛЕ» */}
                      {selectedClientTab === 'gallery' && (
                        <div className="p-6 space-y-4">
                          <div className="flex items-center justify-between">
                            <div>
                              <h4 className="text-sm font-bold text-slate-800">Клиническая фотолаборатория</h4>
                              <p className="text-xs text-slate-400">Снимки до процедур и результаты восстановительного этапа</p>
                            </div>
                            <label className="bg-slate-900 hover:bg-slate-800 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 cursor-pointer shadow-md">
                              <i className="fa-solid fa-camera"></i> Загрузить снимок
                              <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                            </label>
                          </div>

                          {(!selectedClient.photos || selectedClient.photos.length === 0) ? (
                            <div className="py-12 border-2 border-dashed border-slate-200 rounded-2xl text-center space-y-2 bg-slate-50">
                              <i className="fa-solid fa-camera text-slate-300 text-4xl"></i>
                              <h5 className="text-xs font-bold text-slate-700">Нет загруженных фотографий</h5>
                              <p className="text-[11px] text-slate-400">Загрузите снимок для ведения фотопротокола</p>
                            </div>
                          ) : (
                            <div className="grid grid-cols-2 gap-4">
                              {selectedClient.photos.map((photo) => (
                                <div key={photo.id} className="border border-slate-100 rounded-xl overflow-hidden shadow-sm relative group bg-slate-50">
                                  <img src={photo.src} alt="Клинический снимок" className="w-full h-32 object-cover" />
                                  <div className="absolute top-2 left-2 bg-slate-900/80 text-white font-bold text-[9px] px-2 py-0.5 rounded-md uppercase">
                                    {photo.type} — {photo.date}
                                  </div>
                                  <button
                                    onClick={() => handleDeletePhoto(photo.id)}
                                    className="absolute top-2 right-2 bg-rose-600/90 text-white h-7 w-7 flex items-center justify-center rounded-lg hover:bg-rose-700 transition-all opacity-0 group-hover:opacity-100 shadow-md"
                                    title="Удалить снимок"
                                  >
                                    <i className="fa-solid fa-trash-can text-xs"></i>
                                  </button>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}

                    </div>
                  ) : (
                    <div className="p-10 text-center text-slate-400">
                      <i className="fa-solid fa-hospital-user text-4xl mb-2 text-slate-300"></i>
                      <p>Выберите карту пациента из левого списка для открытия его рабочего кабинета.</p>
                    </div>
                  )}
                </div>

              </div>
            )}

            { }
            {/* ВКЛАДКА 2: АНАЛИТИЧЕСКАЯ ПАНЕЛЬ */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                {/* Ряд KPI показателей */}
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <span className="text-xs text-slate-500 font-bold uppercase tracking-wider">Всего карт в базе</span>
                      <h3 className="text-3xl font-extrabold text-slate-900 mt-1">{stats.total}</h3>
                      <span className="text-[11px] text-emerald-600 font-medium block mt-1">🟢 {stats.active} на активном лечении</span>
                    </div>
                    <div className="bg-indigo-50 p-3.5 rounded-2xl text-indigo-600 h-12 w-12 flex items-center justify-center">
                      <i className="fa-solid fa-users text-lg"></i>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <span className="text-xs text-slate-500 font-bold uppercase tracking-wider">Общий оборот клиники</span>
                      <h3 className="text-3xl font-extrabold text-slate-900 mt-1">{stats.revenue.toLocaleString()} ₽</h3>
                      <span className="text-[11px] text-indigo-600 font-medium block mt-1">Средний чек: {stats.avgSpent.toLocaleString()} ₽</span>
                    </div>
                    <div className="bg-indigo-50 p-3.5 rounded-2xl text-indigo-600 h-12 w-12 flex items-center justify-center">
                      <i className="fa-solid fa-ruble-sign text-lg"></i>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <span className="text-xs text-slate-500 font-bold uppercase tracking-wider">Период восстановления</span>
                      <h3 className="text-3xl font-extrabold text-slate-900 mt-1">{stats.waiting}</h3>
                      <span className="text-[11px] text-amber-600 font-medium block mt-1">🕒 Постпроцедурный уход</span>
                    </div>
                    <div className="bg-amber-50 p-3.5 rounded-2xl text-amber-600 h-12 w-12 flex items-center justify-center">
                      <i className="fa-solid fa-clock text-lg"></i>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <span className="text-xs text-slate-500 font-bold uppercase tracking-wider">Архивные профили</span>
                      <h3 className="text-3xl font-extrabold text-slate-900 mt-1">{stats.lost}</h3>
                      <span className="text-[11px] text-rose-600 font-medium block mt-1">Требуют активации</span>
                    </div>
                    <div className="bg-rose-50 p-3.5 rounded-2xl text-rose-600 h-12 w-12 flex items-center justify-center">
                      <i className="fa-solid fa-triangle-exclamation text-lg"></i>
                    </div>
                  </div>
                </div>

                {/* Диаграммы */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="font-bold text-slate-800 text-base">Источники привлечения</h3>
                    <p className="text-xs text-slate-500">Доли рекламных каналов в общем объеме базы данных клиники.</p>

                    <div className="space-y-4 pt-4">
                      {Object.entries(stats.sources).map(([source, count]) => {
                        const percentage = stats.total > 0 ? Math.round((count / stats.total) * 100) : 0;
                        return (
                          <div key={source} className="space-y-1">
                            <div className="flex justify-between items-center text-xs font-semibold text-slate-700">
                              <span className="capitalize">{SOURCE_LABELS[source] || source}</span>
                              <span>{count} клинт. ({percentage}%)</span>
                            </div>
                            <div className="h-2.5 w-full bg-slate-100 rounded-full overflow-hidden">
                              <div 
                                style={{ width: `${percentage}%` }}
                                className={`h-full rounded-full ${
                                  source === 'instagram' ? 'bg-gradient-to-r from-pink-500 to-rose-500' :
                                  source === 'referral' ? 'bg-emerald-500' :
                                  source === 'ads' ? 'bg-indigo-600' :
                                  source === 'walkin' ? 'bg-amber-500' :
                                  'bg-slate-400'
                                }`}
                              ></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="font-bold text-slate-800 text-base">Медицинская воронка лечения</h3>
                    <p className="text-xs text-slate-500">Эффективность распределения пациентов по статусам ухода.</p>

                    <div className="grid grid-cols-5 gap-2 pt-6">
                      <div className="p-3 bg-blue-50/50 rounded-xl border border-blue-100 text-center">
                        <span className="text-[10px] font-bold text-blue-700 block uppercase">Новый</span>
                        <span className="text-xl font-bold text-slate-800 block mt-2">{stats.newClients}</span>
                      </div>

                      <div className="p-3 bg-emerald-50/50 rounded-xl border border-emerald-100 text-center">
                        <span className="text-[10px] font-bold text-emerald-700 block uppercase font-sans">Актив</span>
                        <span className="text-xl font-bold text-slate-800 block mt-2">{stats.active}</span>
                      </div>

                      <div className="p-3 bg-amber-50/50 rounded-xl border border-amber-100 text-center">
                        <span className="text-[10px] font-bold text-amber-700 block uppercase">Реабил.</span>
                        <span className="text-xl font-bold text-slate-800 block mt-2">{stats.waiting}</span>
                      </div>

                      <div className="p-3 bg-slate-100/50 rounded-xl border border-slate-200 text-center">
                        <span className="text-[10px] font-bold text-slate-700 block uppercase font-sans">Заверш.</span>
                        <span className="text-xl font-bold text-slate-800 block mt-2">{stats.completed}</span>
